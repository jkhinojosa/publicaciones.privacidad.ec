name: Deploy Grav Blog to Hostinger (SSH)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🎉 Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 157.173.208.226 >> ~/.ssh/known_hosts

      - name: 🚀 Sync files to Hostinger
        run: |
          rsync -avz \
            --exclude='.git*' \
            --exclude='/cache/*' \
            --exclude='/logs/*' \
            --exclude='/backup/*' \
            --exclude='/tmp/*' \
            -e "ssh -p 65002 -i ~/.ssh/id_ed25519" \
            ./ u868810105@157.173.208.226:domains/privacidad.ec/public_html/publicaciones/

      - name: 🧹 Clear Grav Cache on Hostinger
        run: |
          ssh -p 65002 -i ~/.ssh/id_ed25519 u868810105@157.173.208.226 \
            "cd domains/privacidad.ec/public_html/publicaciones && /opt/alt/php83/usr/bin/php bin/grav cache"
